name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # @rsrsai/memlite 为 file: 依赖——sibling 检出 + symlink 到 workspace 外一级
      - uses: actions/checkout@v4
        with:
          repository: risense-ai/memlite-js
          path: memlite-js
      - run: ln -s "$GITHUB_WORKSPACE/memlite-js" "$GITHUB_WORKSPACE/../memlite-js"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      # file: 依赖的 memlite-js 检出不含构建产物——先构建
      - name: "Build @rsrsai/memlite (file: dependency)"
        run: |
          pnpm --dir memlite-js/packages/core install --frozen-lockfile
          pnpm --dir memlite-js/packages/core build

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: risense-ai/memlite-js
          path: memlite-js
      - run: ln -s "$GITHUB_WORKSPACE/memlite-js" "$GITHUB_WORKSPACE/../memlite-js"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: "Build @rsrsai/memlite (file: dependency)"
        run: |
          pnpm --dir memlite-js/packages/core install --frozen-lockfile
          pnpm --dir memlite-js/packages/core build

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Publish @rsrsai/memlite-obsidian
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if grep -q 'file:' package.json; then
            echo "依赖仍含 file:（上游未上 npm）——npm 包暂不可发布，跳过"
            exit 0
          fi
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public
          else
            npm publish --access public --provenance
          fi
